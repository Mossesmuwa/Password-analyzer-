[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "passguard"
version     = "1.0.0"
description = "Password strength analyzer with entropy scoring, substitution detection, and rich CLI."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

keywords = ["password", "security", "entropy", "cli"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
passguard = "passguard.cli:main"

[project.urls]
Repository = "https://github.com/your-username/passguard"
Issues     = "https://github.com/your-username/passguard/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "C4", "SIM"]

[tool.mypy]
python_version       = "3.10"
strict               = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source = ["passguard"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
